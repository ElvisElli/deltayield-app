<style>
:root{--bg:#4F90D0;--sky1:#2F74C0;--sky2:#6AA6DF;--sky3:#C9E0F4;--ink:#10294F;--card:#FFFFFF;--qshadow:0 1px 2px rgba(255,255,255,.45),0 0 30px rgba(255,255,255,.35);--btn:rgba(255,255,255,.22);--btn-ink:#FFFFFF;--gold:#F2B33D;--layer-filter:none;--star:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1430;--sky1:#060C22;--sky2:#14244A;--sky3:#2A3C68;--ink:#F2F5FF;--card:#FFFFFF;--qshadow:0 2px 24px rgba(5,15,40,.6),0 1px 2px rgba(5,15,40,.5);--btn:rgba(255,255,255,.14);--btn-ink:#F2F5FF;--layer-filter:brightness(.42) saturate(.55);--star:#FFFFFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1430;--sky1:#060C22;--sky2:#14244A;--sky3:#2A3C68;--ink:#F2F5FF;--card:#FFFFFF;--qshadow:0 2px 24px rgba(5,15,40,.6),0 1px 2px rgba(5,15,40,.5);--btn:rgba(255,255,255,.14);--btn-ink:#F2F5FF;--layer-filter:brightness(.42) saturate(.55);--star:#FFFFFF;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.sky{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);overflow:hidden}
.stars{position:absolute;inset:0;opacity:.85;background-image:radial-gradient(1.2px 1.2px at 12% 18%,var(--star) 50%,transparent 60%),radial-gradient(1px 1px at 28% 8%,var(--star) 50%,transparent 60%),radial-gradient(1.6px 1.6px at 41% 26%,var(--star) 50%,transparent 60%),radial-gradient(1px 1px at 55% 12%,var(--star) 50%,transparent 60%),radial-gradient(1.3px 1.3px at 67% 30%,var(--star) 50%,transparent 60%),radial-gradient(1px 1px at 78% 9%,var(--star) 50%,transparent 60%),radial-gradient(1.5px 1.5px at 88% 22%,var(--star) 50%,transparent 60%),radial-gradient(1px 1px at 6% 40%,var(--star) 50%,transparent 60%),radial-gradient(1.2px 1.2px at 94% 42%,var(--star) 50%,transparent 60%),radial-gradient(1px 1px at 35% 44%,var(--star) 50%,transparent 60%),radial-gradient(1.4px 1.4px at 62% 48%,var(--star) 50%,transparent 60%),radial-gradient(1px 1px at 20% 33%,var(--star) 50%,transparent 60%),radial-gradient(1px 1px at 49% 36%,var(--star) 50%,transparent 60%),radial-gradient(1.2px 1.2px at 73% 16%,var(--star) 50%,transparent 60%),radial-gradient(1px 1px at 83% 36%,var(--star) 50%,transparent 60%);animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}
.layer{position:absolute;top:0;bottom:0;left:0;width:calc(var(--tw) * var(--n));background-repeat:repeat-x;background-size:var(--tw) 100%;filter:var(--layer-filter);will-change:transform}

@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-1 * var(--tw)),0,0)}}
.haze{position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.18));pointer-events:none}
.stage{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,4vh,40px);padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}

.quote::before,.quote::after{content:"";width:clamp(22px,5vw,56px);height:1px;background:var(--gold);opacity:.95;flex:none}
.quote em{font-style:normal}
.pick{margin:4px 0 0;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-shadow:var(--qshadow);animation:rise 1.2s .35s cubic-bezier(.2,.7,.2,1) both}
.langs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.enter{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:600;font-size:.95rem;border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(8px);box-shadow:0 10px 30px -14px rgba(10,30,70,.6);animation:rise 1.2s .45s cubic-bezier(.2,.7,.2,1) both;transition:transform .15s ease,background .15s ease}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
